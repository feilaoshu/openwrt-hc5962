name: Build HC5962 OpenWrt (lightweight, no wifi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig zlib1g-dev file wget unzip xsltproc \
            libxml-parser-perl python3-pyelftools ccache libelf-dev
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone OpenWrt 24.10.8
        run: |
          git clone --depth 1 -b v24.10.8 https://github.com/openwrt/openwrt.git owrt
          cd owrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Add Argon theme (Merlin-like UI)
        run: |
          cd owrt/package
          git clone --depth 1 -b master https://github.com/jerrykuku/luci-theme-argon.git luci-theme-argon
          git clone --depth 1 -b master https://github.com/jerrykuku/luci-app-argon-config.git luci-app-argon-config

      - name: Strip WiFi from HC5962 target
        run: |
          cd owrt
          # device-level wireless packages
          sed -i 's/DEVICE_PACKAGES := kmod-mt7603 kmod-mt76x2 kmod-usb3 -uboot-envtools/DEVICE_PACKAGES := kmod-usb3 -uboot-envtools/' target/linux/ramips/image/mt7621.mk
          grep -A8 'define Device/hiwifi_hc5962' target/linux/ramips/image/mt7621.mk
          # target-level wpad default
          sed -i 's/DEFAULT_PACKAGES += wpad-basic-mbedtls uboot-envtools kmod-crypto-hw-eip93/DEFAULT_PACKAGES += kmod-crypto-hw-eip93/' target/linux/ramips/mt7621/target.mk
          grep DEFAULT_PACKAGES target/linux/ramips/mt7621/target.mk

      - name: Configure firmware
        run: |
          cd owrt
          cat > .config <<'CFG'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_hiwifi_hc5962=y
          CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_hiwifi_hc5962=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_TARGZ=n
          CONFIG_TARGET_IMAGES_GZIP=n

          # ---- UI ----
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-commands=y

          # ---- 延迟/丢包/断流 可视化 ----
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd=y
          CONFIG_PACKAGE_collectd-mod-ping=y
          CONFIG_PACKAGE_collectd-mod-interface=y
          CONFIG_PACKAGE_collectd-mod-cpu=y
          CONFIG_PACKAGE_collectd-mod-memory=y
          CONFIG_PACKAGE_collectd-mod-df=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_arp-scan=y
          CONFIG_PACKAGE_umdns=y

          # ---- 家用网络功能 ----
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_miniupnpd=y
          CONFIG_PACKAGE_igmpproxy=y
          CONFIG_PACKAGE_udpxy=y
          CONFIG_PACKAGE_luci-app-udpxy=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          # ---- USB 保留 ----
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-extras=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_usbutils=y

          # ---- 明确关闭无线 ----
          CONFIG_PACKAGE_kmod-mt7603=n
          CONFIG_PACKAGE_kmod-mt76x2=n
          CONFIG_PACKAGE_wpad-basic-mbedtls=n
          CONFIG_PACKAGE_iw=n
          CONFIG_PACKAGE_iwinfo=n

          # ---- 明确不加 ----
          CONFIG_PACKAGE_luci-app-openclash=n
          CONFIG_PACKAGE_luci-app-passwall=n
          CONFIG_PACKAGE_adguardhome=n
          CONFIG_PACKAGE_sqm-scripts=n
          CFG
          sed -i 's/^          //' .config
          make defconfig
          grep -E 'CONFIG_TARGET_ramips_mt7621_DEVICE_hiwifi_hc5962|CONFIG_PACKAGE_luci-theme-argon|CONFIG_PACKAGE_luci-app-statistics|CONFIG_PACKAGE_wpad|CONFIG_PACKAGE_kmod-mt76' .config || true

      - name: Download sources
        run: |
          cd owrt
          make -j$(nproc) download 2>&1 | tail -30

      - name: Build firmware
        run: |
          cd owrt
          make -j$(nproc) 2>&1 | tee build.log | tail -40
          echo "==== images ===="
          ls -lh bin/targets/ramips/mt7621/ || true

      - name: Show errors on failure
        if: failure()
        run: |
          cd owrt || exit 0
          grep -rniE "error|failed" build.log | tail -60 || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hc5962-openwrt
          path: |
            owrt/bin/targets/ramips/mt7621/*.bin
            owrt/bin/targets/ramips/mt7621/*.tar.gz
            owrt/bin/targets/ramips/mt7621/profiles.json
          retention-days: 90
